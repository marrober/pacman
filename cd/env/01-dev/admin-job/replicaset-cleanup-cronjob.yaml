kind: CronJob
apiVersion: batch/v1
metadata:
  name: remove-stale-replicasets
  namespace: pacman-development
  labels:
    app.kubernetes.io/part-of: Triggers
spec:
  schedule: 0 9-17 * * *
  concurrencyPolicy: Allow
  suspend: false
  jobTemplate:
    metadata:
      creationTimestamp: null
    spec:
      template:
        metadata:
          creationTimestamp: null
        spec:
          containers:
            - name: terminal
              image: 'quay.io/marrober/devex-terminal-4:minimal-terminal-1.4'
              command:
                - /bin/sh
              args:
                - '-c'
                - |
                  echo "Pruning old replicasets"
                  oc get replicaset -o jsonpath='{range .items[?(@.spec.replicas==0)]}{.metadata.name}{"\n"}{end}' | xargs -r oc delete replicaset
              resources: {}
              terminationMessagePath: /dev/termination-log
              terminationMessagePolicy: File
              imagePullPolicy: Always
          restartPolicy: OnFailure
          terminationGracePeriodSeconds: 30
          dnsPolicy: ClusterFirst
          serviceAccountName: deployer
          serviceAccount: deployer
          securityContext: {}
          schedulerName: default-scheduler
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 1