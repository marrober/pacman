apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: pacman-ci-root
  namespace: openshift-gitops
  annotations:
    argocd.argoproj.io/sync-wave: "2"
spec:
  project: pacman-ci
  destination:
    namespace: openshift-gitops
    server: https://kubernetes.default.svc
  ignoreDifferences:
  - group: argoproj.io
    jsonPointers:
    - /status
    kind: Application
  - group: triggers.tekton.dev
    jsonPointers:
    - /status
    kind: EventListener
  - group: triggers.tekton.dev
    jsonPointers:
    - /status
    kind: TriggerTemplate
  - group: triggers.tekton.dev
    jsonPointers:
    - /status
    kind: TriggerBinding
  - group: route.openshift.io
    jsonPointers:
    - /spec/host
    kind: Route
  source:
    path: .
    targetRevision: main
    repoURL: https://github.com/marrober/pacman.git
  syncPolicy:
    automated: 
      prune: true 
      selfHeal: true 
      allowEmpty: false 
    syncOptions:     
    - Validate=true 
    - CreateNamespace=false 
    - PrunePropagationPolicy=foreground 
    - PruneLast=true 
    retry:
      limit: 1
      backoff:
        duration: 5s 
        factor: 2
        maxDuration: 20s 

