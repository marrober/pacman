apiVersion: triggers.tekton.dev/v1alpha1
kind: EventListener
metadata:
  name: pacman-ci-verification-pipeline-listener-interceptor
spec:
  serviceAccountName: pipeline
  triggers:
  - name: github-listener-tag-creation
    interceptors:
      - ref:
          name: "github"
          kind: ClusterInterceptor
          apiVersion: triggers.tekton.dev
        params:
        # Look for tag creation events
        - name: "eventTypes"
          value: ["create"]
        - name: "filter"
          value: "body.ref_type == 'tag'"
    bindings:
      - ref: pacman-ci-verification-tag-binding
    template:
      ref: pacman-ci-verification-tag-template

  - name: github-listener-release-creation
    interceptors:
      - ref:
          name: "github"
          kind: ClusterInterceptor
          apiVersion: triggers.tekton.dev
        params:
        # Look for release creation events
        - name: "eventTypes"
          value: ["release"]
        - name: "filter"
          value: "body.action == 'published'"
    bindings:
      - ref: pacman-ci-verification-release-binding
    template:
      ref: pacman-ci-verification-release-template
