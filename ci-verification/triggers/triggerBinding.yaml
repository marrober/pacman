apiVersion: triggers.tekton.dev/v1alpha1
kind: TriggerBinding
metadata:
  name: pacman-ci-verification-tag-binding
spec:
  params:
  - name: gitrepository.url
    value: $(body.repository.clone_url)
  - name: tag
    value: $(body.ref)
  - name: git-event-type
    value: $(header.X-Github-Event)
  - name: git-tag-or-branch
    value: $(extensions.gitRef)
---
apiVersion: triggers.tekton.dev/v1alpha1
kind: TriggerBinding
metadata:
  name: pacman-ci-verification-release-binding
spec:
  params:
  - name: gitrepository.url
    value: $(body.repository.clone_url)
  - name: tag
    value: $(body.ref)
  - name: git-event-type
    value: $(header.X-Github-Event)
  - name: git-tag-or-branch
    value: $(extensions.gitRef)

