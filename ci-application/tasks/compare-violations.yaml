apiVersion: tekton.dev/v1beta1
kind: Task
metadata:
  name: compare-violations
  annotations:
    argocd.argoproj.io/sync-wave: "3"
spec:
  params:
    - name: base-violations-file
      description: Path to the base image violations file
      type: string
      default: /workspace/base-violations.json
    - name: image-violations-file
      description: Path to the built image violations file
      type: string
      default: /workspace/image-violations.json
    - name: report-format
      type: string
      description: json or table
      default: table
  results:
    - name: report-file
  workspaces:
    - name: violations
      description: Workspace containing base and image violation files
      mountPath: /workspace
    - name: resources
      mountPath: /resources
  steps:
    - name: compare-cves
      image: image-registry.openshift-image-registry.svc:5000/pacman-ci/python:v3.1.2-17944
      script: |
        #!/usr/bin/env bash

        set -euo pipefail

        report="vulnerability-comparison.$(params.report-format)"

        python3 /resources/pacman/ci-application/scripts/compare_vulnerability_logs.py \
          "$(params.base-violations-file)" \
          "$(params.image-violations-file)" \
          --format "$(params.report-format)" \
          > "$report"

        echo "Created $report"
        printf '%s' "$report" > "$(results.report-file.path)"

        echo $report

      workingDir: /workspace
