apiVersion: tekton.dev/v1beta1
kind: Task
metadata:
  name: compare-violations
spec:
  params:
    - name: base-violations-file
      description: Path to the base image violations file
      type: string
      default: /workspace/base-violations.json
    - name: image-violations-file
      description: Path to the built image violations file
      type: string
      default: /workspace/image-violations.json
    - name: output-file
      description: Path for violation messages only present in the built image
      type: string
      default: /workspace/new-image-cves.json
    - name: summary-file
      description: Path for the violation comparison summary
      type: string
      default: /workspace/violation-comparison-summary.json
  results:
    - name: base-violation-count
      description: Number of unique CVE/GHSA IDs in the base image violations file
    - name: image-violation-count
      description: Number of unique CVE/GHSA IDs in the built image violations file
    - name: exclusive-image-violation-count
      description: Number of unique CVE/GHSA IDs only present in the built image
  workspaces:
    - name: violations
      description: Workspace containing base and image violation files
      mountPath: /workspace
  steps:
    - name: compare-cves
      image: image-registry.openshift-image-registry.svc:5000/pacman-ci/ubi:latest
      script: |
        #!/usr/bin/env bash

        set -euo pipefail

        BASE_FILE="$(params.base-violations-file)"
        IMAGE_FILE="$(params.image-violations-file)"
        OUTPUT_FILE="$(params.output-file)"
        SUMMARY_FILE="$(params.summary-file)"

        for file in "$BASE_FILE" "$IMAGE_FILE"; do
          if [[ ! -f "$file" ]]; then
            echo "Required file not found: $file"
            exit 1
          fi
        done

        dnf install -y -q jq

        COMPARISON_RESULT=$(jq -n \
          --slurpfile base "$BASE_FILE" \
          --slurpfile image "$IMAGE_FILE" \
          '
            def extract_id:
              if test("CVE-[0-9]{4}-[0-9]+") then (match("CVE-[0-9]{4}-[0-9]+") | .string)
              elif test("GHSA-[a-z0-9]{4}-[a-z0-9]{4}-[a-z0-9]{4}") then (match("GHSA-[a-z0-9]{4}-[a-z0-9]{4}-[a-z0-9]{4}") | .string)
              else null end;
            ($base[0] // []) as $base |
            ($image[0] // []) as $image |
            ([$base[] | extract_id | select(. != null)] | unique) as $base_ids |
            ([$image[] | extract_id | select(. != null)] | unique) as $image_ids |
            [$image[]
              | . as $line
              | ($line | extract_id) as $id
              | select($id != null and (($base_ids | index($id)) == null))
              | $line
            ] as $exclusive |
            {
              base_violation_count: ($base_ids | length),
              image_violation_count: ($image_ids | length),
              application_layer_violation_count: ($exclusive | length),
              exclusive_violations: $exclusive
            }
          ')

        echo "$COMPARISON_RESULT" | jq '.exclusive_violations' > "$OUTPUT_FILE"
        echo "$COMPARISON_RESULT" | jq '{
          base_violation_count,
          image_violation_count,
          exclusive_image_violation_count
        }' > "$SUMMARY_FILE"

        BASE_COUNT=$(jq -r '.base_violation_count' "$SUMMARY_FILE")
        IMAGE_COUNT=$(jq -r '.image_violation_count' "$SUMMARY_FILE")
        EXCLUSIVE_COUNT=$(jq -r '.exclusive_image_violation_count' "$SUMMARY_FILE")

        echo -n "$BASE_COUNT" > "$(results.base-violation-count.path)"
        echo -n "$IMAGE_COUNT" > "$(results.image-violation-count.path)"
        echo -n "$EXCLUSIVE_COUNT" > "$(results.exclusive-image-violation-count.path)"

        echo "Violation comparison summary:"
        echo "  Base image violations:               $BASE_COUNT"
        echo "  Built image violations:              $IMAGE_COUNT"
        echo "  Application layer vulnerabilities:   $EXCLUSIVE_COUNT"
        echo ""
        echo "Summary written to: $SUMMARY_FILE"
        cat "$SUMMARY_FILE"
        echo ""
        echo "Application layer vulnerabilities:"
      workingDir: /workspace
