apiVersion: tekton.dev/v1beta1
kind: Task
metadata:
  name: argocd-sync-and-wait
  annotations:
    argocd.argoproj.io/sync-wave: "3"
spec:
  params:
    - description: name of the application to sync
      name: application-name
      type: string
    - default: HEAD
      description: the revision to sync to
      name: revision
      type: string
    - default: v2.2.2
      name: argocd-version
      type: string
  stepTemplate:
    envFrom:
      - configMapRef:
          name: argocd-env-configmap
      - secretRef:
          name: argocd-env-secret
    resources: {}
  steps:
    - image: image-registry.openshift-image-registry.svc:5000/pacman-ci/argocd:$(params.argocd-version)
      name: login
      resources: {}
      script: >
        echo "Syncing $(params.application-name) against $ARGOCD_SERVER"

        argocd app sync "$(params.application-name)" --revision "$(params.revision)"  --insecure --grpc-web