apiVersion: tekton.dev/v1beta1
kind: Task
metadata:
  name: build
spec:
  params:
    - name: TLSVERIFY
      default: "false"
      description: Verify the TLS on the registry endpoint
      type: string
    - name: STORAGE_DRIVER
      description: The Buildah storage STORAGE_DRIVER
      type: string
    - name: app-dir
      type: string
    - name: node_js_image_repo
      type: string
    - name: node_js_image_name
      type: string
    - name: node_js_image_tag
      type: string
  stepTemplate:
    env:
      - name: "HOME"
        value: "/tekton/home"
  steps:
    - name: package-node-app
      command:
      - /bin/sh
      - -c
      args:
      - |-
        pwd
        npm install npm@latest --omit=dev
        ls -al
      image: $(params.node_js_image_repo)/$(params.node_js_image_name):$(params.node_js_image_tag)
      resources:
        limits:
          memory: 500Mi
          cpu: 500m
        requests:
          memory: 250Mi
          cpu: 150m
      workingDir: /resources/$(params.app-dir)
    - name: update-dockerfile
      script: >-
        #!/usr/bin/env bash

        set +x

        # NODE_IMAGE_URL=$(oc get is/$(params.node_js_image_name) -o jsonpath='{.status.publicDockerImageRepository}')

         NODE_IMAGE_URL=$(params.node_js_image_repo)/$(params.node_js_image_name):$(params.node_js_image_tag)
        
        echo $NODE_IMAGE_URL

        sed -e "s|source-image|$NODE_IMAGE_URL|g" dockerfile > new-dockerfile

        cat new-dockerfile

      image: image-registry.openshift-image-registry.svc:5000/pacman-ci/buildah:latest
      resources:
        limits:
          memory: 500Mi
          cpu: 500m
        requests:
          memory: 250Mi
          cpu: 150m
      workingDir: /resources/$(params.app-dir)
    - name: build
      command:
      - buildah
      - bud
      - --tls-verify=$(params.TLSVERIFY)
      - --storage-driver=$(params.STORAGE_DRIVER)
      - --root
      - /files/buildah-containers
      - --layers
      - -f
      - ./new-dockerfile
      - --no-cache
      - -t
      - my-container-image
      - .
      image: image-registry.openshift-image-registry.svc:5000/pacman-ci/buildah:latest
      resources: {}
      securityContext:
        capabilities:
          add:
          - SETFCAP
      workingDir: /resources/$(params.app-dir)

    - name: list-images
      command:
      - buildah
      - images
      - --storage-driver=$(params.STORAGE_DRIVER)
      - --root
      - /files/buildah-containers
      image: image-registry.openshift-image-registry.svc:5000/pacman-ci/buildah:latest
      resources:
        limits:
          memory: 500Mi
          cpu: 500m
        requests:
          memory: 250Mi
          cpu: 150m
      securityContext:
        capabilities:
          add:
          - SETFCAP
      workingDir: /
  workspaces:
    - mountPath: /files
      name: files
    - mountPath: /resources
      name: resources

