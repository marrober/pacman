apiVersion: tekton.dev/v1beta1
kind: Task
metadata:
  name: push-image-to-ocp
  annotations:
    argocd.argoproj.io/sync-wave: "3"
spec:
  params:
    - name: imagestream-url
      type: string
    - name: STORAGE_DRIVER
      type: string
    - name: TLSVERIFY
      type: string
    - name: pipelineRunName
      type: string
    - name: image-short-name
      type: string
    - name: git-commit
      type: string
  results:
    - name: new-tag
  stepTemplate:
    env:
      - name: "HOME"
        value: "/tekton/home"
  steps:
    - name: push-to-imagestream
      script: >-
        #!/usr/bin/env bash

        set +x

        var1=$(params.git-commit)

        echo $var1

        var1=${var1:0:7}

        tag=$var1

        echo $(params.imagestream-url):$tag

        echo -n $tag > $(results.new-tag.path)

        buildah push --storage-driver=$(params.STORAGE_DRIVER) \

        --tls-verify=$(params.TLSVERIFY) --root /files/buildah-containers \
        
        --digestfile $(workspaces.files.path)/image-digest-to-image-stream \

        localhost/my-container-image:latest  \

        docker://$(params.imagestream-url):$tag

        echo " --- image pushed ---"

        cat "$(workspaces.files.path)"/image-digest-to-image-stream; echo

      image: image-registry.openshift-image-registry.svc:5000/pacman-ci/buildah:latest  
      securityContext:
        runAsUser: 0
        capabilities:
          add: ["SETFCAP"]
      resources: {}
    - name: get-layers
      script: >-
        #!/usr/bin/env bash

        set +x

        var1=$(params.git-commit)

        echo $var1

        var1=${var1:0:7}

        tag=$var1

        buildah inspect  --type image --storage-driver=$(params.STORAGE_DRIVER) --root /files/buildah-containers --format '{{range .OCIv1.RootFS.DiffIDs}}{{println .}}{{end}}' $(params.imagestream-url):$tag

      image: image-registry.openshift-image-registry.svc:5000/pacman-ci/buildah:latest
      resources:
        limits:
          memory: 500Mi
          cpu: 500m
        requests:
          memory: 250Mi
          cpu: 150m
      securityContext:
        capabilities:
          add:
          - SETFCAP
      workingDir: /
    - name: register-global-tag
      script: >-
        #!/usr/bin/env bash

        set +x

        var1=$(params.git-commit)

        echo $var1

        var1=${var1:0:7}

        tag=$var1

        echo $(params.imagestream-url):$tag
        
        sleep 10

        oc import-image $(params.image-short-name):$tag --from=$(params.imagestream-url):$tag -n $(context.taskRun.namespace) --confirm -o name

      image: image-registry.openshift-image-registry.svc:5000/pacman-ci/terminal:2.7
      securityContext:
        capabilities:
          add: ["SETFCAP"]
      resources: {}
  workspaces:
  - mountPath: /files
    name: files