apiVersion: tekton.dev/v1beta1
kind: Task
metadata:
  name: push-image-to-ocp
spec:
  params:
    - name: imagestream-url
      type: string
    - name: STORAGE_DRIVER
      type: string
    - name: TLSVERIFY
      type: string
    - name: pipelineRunName
      type: string
    - name: image-short-name
      type: string
  results:
    - name: new-tag
  stepTemplate:
    env:
      - name: "HOME"
        value: "/tekton/home"
  steps:
    - name: push-to-imagestream
      script: >-
        #!/usr/bin/env bash

        set +x

        var1=$(params.pipelineRunName)

        echo $var1

        var2=${var1:(${#var1} - 5):${#var1}}

        tag=$var2

        echo $(params.imagestream-url):$tag

        echo -n $tag > $(results.new-tag.path)

        buildah push --storage-driver=$(params.STORAGE_DRIVER) \

        --tls-verify=$(params.TLSVERIFY) --root /files/buildah-containers \

        localhost/my-container-image:latest \

        docker://$(params.imagestream-url):$tag

      image: image-registry.openshift-image-registry.svc:5000/pacman-ci/buildah:latest  
      securityContext:
        capabilities:
          add: ["SETFCAP"]
      resources: {}
    - name: register-global-tag
      script: >-
        #!/usr/bin/env bash

        set +x

        var1=$(params.pipelineRunName)

        echo $var1

        var2=${var1:(${#var1} - 5):${#var1}}

        tag=$var2

        echo $(params.imagestream-url):$tag
        
        echo $(context.taskRun.namespace)

        sleep 30

        oc import-image $(params.image-short-name):$tag --from=$(params.imagestream-url):$tag -n $(context.taskRun.namespace) \--confirm

      image: quay.io/openshift/origin-cli:latest  
      securityContext:
        capabilities:
          add: ["SETFCAP"]
      resources: {}
  workspaces:
  - mountPath: /files
    name: files