apiVersion: tekton.dev/v1beta1
kind: Task
metadata:
  name: push-image-to-ocp
spec:
  params:
    - name: imagestream-url
      type: string
    - name: STORAGE_DRIVER
      type: string
    - name: TLSVERIFY
      type: string
    - name: pipelineRunName
      type: string
    - name: image-short-name
      type: string
  results:
    - name: new-tag
  stepTemplate:
    env:
      - name: "HOME"
        value: "/tekton/home"
  steps:
    - name: push-to-imagestream
      script: >-
        #!/usr/bin/env bash

        set +x

        var1=$(params.pipelineRunName)

        echo $var1

        var2=${var1:(${#var1} - 5):${#var1}}

        tag=$var2

        echo $(params.imagestream-url):$tag

        echo -n $tag >  $(results.new-tag.path)

        buildah push --storage-driver=$(params.STORAGE_DRIVER) \

        --tls-verify=$(params.TLSVERIFY) --root /files/buildah-containers \

        localhost/my-container-image:latest \

        docker://$(params.imagestream-url):$tag

      image: image-registry.openshift-image-registry.svc:5000/pacman-ci/buildah:latest  
      securityContext:
        capabilities:
          add: ["SETFCAP"]
      resources: {}
    - name: register-global-tag
      script: |
        #!/usr/bin/env bash

        set +x

        var1="$(params.pipelineRunName)"
        tag="${var1:(${#var1} - 5):${#var1}}"
        namespace="$(context.taskRun.namespace)"
        imagestream_url="$(params.imagestream-url)"
        image_short_name="$(params.image-short-name)"

        echo "PipelineRun: ${var1}"
        echo "Tag: ${tag}"
        echo "Namespace: ${namespace}"
        echo "ImageStream URL: ${imagestream_url}"
        echo "Image short name: ${image_short_name}"

        sleep 30

        import_cmd="oc import-image ${image_short_name}:${tag} --from=${imagestream_url}:${tag} -n ${namespace} --confirm"

        echo "Command to execute:"
        echo "${import_cmd}"

        eval "${import_cmd}"
      image: quay.io/openshift/origin-cli:latest
      securityContext:
        capabilities:
          add: ["SETFCAP"]
      resources: {}
  workspaces:
  - mountPath: /files
    name: files