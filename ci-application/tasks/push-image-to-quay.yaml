apiVersion: tekton.dev/v1beta1
kind: Task
metadata:
  name: push-image-to-quay
spec:
  params:
    - name: quay-instance-url
      description: The URL of the quay instance
      type: string
      default: ""
    - name: quay-account
      description: The quay account that matches the credentials stored in the mounted secret.
      type: string
      default: ""
    - name: quay-repository
      description: The quay repository in which to store the image.
      type: string
      default: ""
    - name: image-stream-location
      type: string
      default: ""
      description: The full image url in the OpenShift image stream
    - name: STORAGE_DRIVER
      description: The Buildah storage STORAGE_DRIVER
      type: string
    - name: imageTag
      type: string
    - name: node_js_image_name
      type: string
  results:
    - name: quay-image-repo-location
    - name: BASE_IMAGES_DIGESTS
    - description: Digest of the image just built
      name: IMAGE_DIGEST
    - description: Image repository where the built image was pushed
      name: IMAGE_URL
  steps:
    - name: buildah-pull-image
      script: |
        echo "Pulling image : $(params.image-stream-location):$(params.imageTag)"

        buildah pull --storage-driver=$(params.STORAGE_DRIVER) --root /files/buildah-containers $(params.image-stream-location):$(params.imageTag)

      image: image-registry.openshift-image-registry.svc:5000/pacman-ci/buildah:latest
      securityContext:
        capabilities:
          add: ["SETFCAP"]
      resources:
        limits:
          memory: 300Mi
          cpu: 300m
        requests:
          memory: 250Mi
          cpu: 150m
          
    - name: buildah-tag-image
      script: |
        echo "Tagging image : $(params.quay-instance-url)/$(params.quay-account)/$(params.quay-repository):$(params.imageTag)"

        buildah tag --storage-driver=$(params.STORAGE_DRIVER) --root /files/buildah-containers $(params.image-stream-location):$(params.imageTag) $(params.quay-instance-url)/$(params.quay-account)/$(params.quay-repository):$(params.imageTag)

      image: image-registry.openshift-image-registry.svc:5000/pacman-ci/buildah:latest
      securityContext:
        capabilities:
          add: ["SETFCAP"]
      resources:
        limits:
          memory: 300Mi
          cpu: 300m
        requests:
          memory: 250Mi
          cpu: 150m
          
    - name: check-mount
      image: image-registry.openshift-image-registry.svc:5000/pacman-ci/buildah:latest
      env: 
        - name: DOCKER_CONFIG
          value: "/etc/secret-volume/.dockerconfigjson"
        - name: COSIGN_PASSWORD
          valueFrom:
            secretKeyRef:
              name: signing-secrets
              key: cosign.password
      script: |
        echo "Checking the mounted secret data"

        cat $DOCKER_CONFIG

        ls -al /etc/secret-volume

        echo "----------------------------------"

        ls -al /etc/cosign-keys

        printenv | grep COSIGN_PASSWORD

        cat /etc/cosign-keys/cosign.key

      volumeMounts:
        - name: quay-auth-secret
          mountPath: /etc/secret-volume
          readOnly: true
        - name: cosign-secret
          mountPath: /etc/cosign-keys
          readOnly: true

    - name: push-image-to-quay
      script: |
        echo $(workspaces.resources.path)/sbom-image.json

        buildah images --storage-driver=$(params.STORAGE_DRIVER) --root /files/buildah-containers --format '{{ .Name }}:{{ .Tag }}@{{ .Digest }}' | grep $(params.node_js_image_name) > $(results.BASE_IMAGES_DIGESTS.path)

        base_image_name=$(buildah inspect --storage-driver=$(params.STORAGE_DRIVER) --root /files/buildah-containers --format '{{ index .ImageAnnotations "org.opencontainers.image.base.name"}}' $(params.quay-instance-url)/$(params.quay-account)/$(params.quay-repository):$(params.imageTag) | cut -f1 -d'@')
   
        base_image_digest=$(buildah inspect --storage-driver=$(params.STORAGE_DRIVER) --root /files/buildah-containers --format '{{ index .ImageAnnotations "org.opencontainers.image.base.digest"}}' $(params.quay-instance-url)/$(params.quay-account)/$(params.quay-repository):$(params.imageTag))

        echo "Base image name   : $base_image_name"

        echo "Base image digest : $base_image_digest"

        echo -n "$(params.quay-instance-url)/$(params.quay-account)/$(params.quay-repository):$(params.imageTag)" | tee $(results.IMAGE_URL.path); echo

        container=$(buildah from --storage-driver=$(params.STORAGE_DRIVER) --root /files/buildah-containers --pull-never $(params.quay-instance-url)/$(params.quay-account)/$(params.quay-repository):$(params.imageTag))

        echo "Container"
        echo $container

        buildah copy --storage-driver=$(params.STORAGE_DRIVER) --root /files/buildah-containers $container  $(workspaces.resources.path)/sbom-image.json /root/buildinfo/content_manifests/

        echo "copy done"

        buildah config --storage-driver=$(params.STORAGE_DRIVER) --root /files/buildah-containers -a org.opencontainers.image.base.name=${base_image_name} -a org.opencontainers.image.base.digest=${base_image_digest} $container

        echo "commit container image"
        buildah --storage-driver=$(params.STORAGE_DRIVER) --root /files/buildah-containers commit $container $(params.quay-instance-url)/$(params.quay-account)/$(params.quay-repository):$(params.imageTag)

        buildah images --storage-driver=$(params.STORAGE_DRIVER) --root /files/buildah-containers

        echo "push container image"
        buildah push --storage-driver=$(params.STORAGE_DRIVER) --authfile /etc/secret-volume/.dockerconfigjson --root /files/buildah-containers --digestfile $(workspaces.files.path)/image-digest $(params.quay-instance-url)/$(params.quay-account)/$(params.quay-repository):$(params.imageTag)

        echo " --- image pushed ---"
        cat "$(workspaces.files.path)"/image-digest | tee $(results.IMAGE_DIGEST.path); echo

        echo " - "

        echo "$(params.quay-instance-url)/$(params.quay-account)/$(params.quay-repository):$(params.imageTag)" | tee $(results.IMAGE_URL.path)

        echo "$(params.quay-instance-url)/$(params.quay-account)/$(params.quay-repository):$(params.imageTag)" > $(results.quay-image-repo-location.path)

      image: image-registry.openshift-image-registry.svc:5000/pacman-ci/buildah:latest
      securityContext:
        capabilities:
          add: ["SETFCAP"]
      resources:
        limits:
          memory: 300Mi
          cpu: 300m
        requests:
          memory: 250Mi
          cpu: 150m
      volumeMounts:
        - name: quay-auth-secret
          mountPath: /etc/secret-volume
          readOnly: true
#    - name: test
#      image: image-registry.openshift-image-registry.svc:5000/pacman-ci/terminal:2.3
#      env: 
#        - name: IMAGE_DIGEST_VAR
#          value: $(results.IMAGE_DIGEST.path)
#      script: |
#        ls -al /tekton/results
#        
#        cat /tekton/results/IMAGE_DIGEST

#        echo "----------"

#        printenv | grep IMAGE_

    - name: sign-and-attest-sbom
      image: image-registry.openshift-image-registry.svc:5000/pacman-ci/terminal:2.3
      env: 
        - name: DOCKER_CONFIG
          value: "/etc/secret-volume"
        - name: COSIGN_PASSWORD
          valueFrom:
            secretKeyRef:
              name: signing-secrets
              key: cosign.password
      script: |
        ls -al /tekton/results
        
        cat /tekton/results/IMAGE_DIGEST; echo 

        echo "1 ----------"

        printenv

        echo "2 ----------"

        cat /tekton/results/IMAGE_DIGEST > $IMAGE

        echo "3 ----------"

        printenv

        echo "4 ----------"

        ls -al /etc/cosign-keys

        echo "5 ----------"

        head -n 10 bom-image.json

        echo "6 ---------"
 
        cosign-2 attest --key /etc/cosign-keys/cosign.key --type cyclonedx --predicate bom-image.json --verbose $IMAGE
      workingDir: $(workspaces.resources.path)
      volumeMounts:
        - name: quay-auth-secret
          mountPath: /etc/secret-volume
          readOnly: true
        - name: cosign-secret
          mountPath: /etc/cosign-keys
          readOnly: true

#    - name: upload-sbom
#      image: image-registry.openshift-image-registry.svc:5000/pacman-ci/cosign:v2.1.1
#      env: 
#        - name: DOCKER_CONFIG
#          value: "/etc/secret-volume"
#      args:
#        - attach
#        - sbom
#        - --sbom
#        - sbom-image.json
#        - --verbose
#        - --type
#        - cyclonedx
#        - $(params.quay-instance-url)/$(params.quay-account)/$(params.quay-repository):$(params.imageTag)
#      workingDir: $(workspaces.resources.path)
#      volumeMounts:
#        - name: quay-auth-secret
#          mountPath: /etc/secret-volume
#          readOnly: true
  volumes:
    - name: quay-auth-secret
      secret:
        secretName: quay-auth-secret
    - name: cosign-secret
      secret: 
        secretName: signing-secrets
  workspaces:
  - name: files
    mountPath: /files
  - name: resources
    mountPath: /resources
