apiVersion: tekton.dev/v1beta1
kind: Task
metadata:
  name: generate-sbom
spec:
  params:
  - name: SBOM_FILE
    type: string
  - name: public-url
    type: string
  stepTemplate:
    env:
      - name: "HOME"
        value: "/tekton/home"
      - name: PUBLIC_URL
        value: $(params.public-url)
  results:
    - name: sbom_path
  steps:
    - name: sbom-syft-generate
      image: image-registry.openshift-image-registry.svc:5000/pacman-ci/terminal:2.4
      script: |

        IMAGE_SBOM="$(workspaces.resources.path)/$(params.SBOM_FILE)"

        nameTag=$(echo "$PUBLIC_URL" | cut -d'/' -f3)

        echo $nameTag

        echo $IMAGE_SBOM

        syft "$(params.public-url)" --output spdx-json="$IMAGE_SBOM"

        jq --arg name "$nameTag" '.name = $name' $IMAGE_SBOM >$IMAGE_SBOM-2

        rm $IMAGE_SBOM

        mv $IMAGE_SBOM-2 $IMAGE_SBOM

        echo "Top of the SBOM .... "

        head -20 "$IMAGE_SBOM"

         echo -n $(params.SBOM_FILE) > $(results.sbom_path.path)
      resources:
        limits:
          memory: 1000Mi
          cpu: '1'
        requests:
          memory: 250Mi
          cpu: 150m
  workspaces:
    - mountPath: /resources
      name: resources

