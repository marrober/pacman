apiVersion: tekton.dev/v1beta1
kind: Task
metadata:
  name: generate-sbom
spec:
  params:
  - name: SBOM_FILE
    type: string
  - name: public-url
    type: string
  stepTemplate:
    env:
      - name: "HOME"
        value: "/tekton/home"
  results:
    - name: sbom_path
  steps:
    - name: sbom-syft-generate
      image: image-registry.openshift-image-registry.svc:5000/pacman-ci/terminal:2.4
      script: |

        IMAGE_SBOM="$(workspaces.resources.path)/$(params.SBOM_FILE)"

        $nameTag = $(echo "$(params.public-url)" | cut -d'/' -f3')

        echo $IMAGE_SBOM

        syft $(params.public-url) --output spdx-json=$IMAGE_SBOM

        echo "SBOM generated - now to remove the unwanted content"

        ls -al 

        jq 'del(.predicate.files)' $IMAGE_SBOM > $IMAGE_SBOM-2

        jq --arg name "pacman-update-name" '.name = $nameTag' $IMAGE_SBOM-2 >$IMAGE_SBOM-3

        rm $IMAGE_SBOM

        mv $IMAGE_SBOM-3 $IMAGE_SBOM

        ls -al 

        head -20 "$IMAGE_SBOM"

         echo -n $(params.SBOM_FILE) > $(results.sbom_path.path)
      resources:
        limits:
          memory: 1000Mi
          cpu: '1'
        requests:
          memory: 250Mi
          cpu: 150m
  workspaces:
    - mountPath: /resources
      name: resources

