apiVersion: triggers.tekton.dev/v1alpha1
kind: TriggerBinding
metadata:
  name: pacman-ci-binding
  annotations:
    argocd.argoproj.io/sync-wave: "4"
spec:
  params:
  - name: gitrepository.url
    value: $(body.repository.clone_url)
  - name: gitrevision
    value: $(body.head_commit.id)
  - name: branch 
    value: $(extensions.branch)
