apiVersion: tekton.dev/v1
kind: Pipeline
metadata:
  labels:
    app.kubernetes.io/instance: pacman-git
    app.kubernetes.io/name: pacman-git
    pipeline.openshift.io/runtime: nodejs
    pipeline.openshift.io/runtime-version: 16-ubi8
    pipeline.openshift.io/type: kubernetes
  annotations:
    argocd.argoproj.io/sync-wave: "4"
  name: pacman-quick-to-quay
spec:
  params:
    ## Repository parameters
  - name: GIT_REPO
    type: string
  - name: GIT_REVISION
    default: ""
    type: string
  - name: GIT_REPO_NAME
    type: string
    ## Image build parameters
  - name: PATH_CONTEXT
    default: .
    type: string
  - name: STORAGE_DRIVER
    type: string
  - name: TLSVERIFY
    type: string
  - name: node_js_image_repo
    type: string
  - name: node_js_image_name
    type: string
  - name: node_js_image_tag
    type: string
 # - name: VERSION
 #   default: 16-ubi8
 #   type: string
    # OpenShift imagestream URL parameters
    #
  - name: IMAGE_NAME 
    type: string
  - name: IMAGE_SHORT_NAME
    type: string
    ## Push to quay
  - name: rekor-url
    type: string
  - name: quay-instance-url
    type: string
  - name: quay-account                   # Quay account name
    type: string
  - name: quay-repository                # Quay repository name
    type: string
  tasks:
##------------------------------------------------------------------
# Fetch source to build
##------------------------------------------------------------------
  - name: fetch-repository
    params:
    - name: url
      value: $(params.GIT_REPO)
    - name: revision
      value: $(params.GIT_REVISION)
    - name: repoName
      value: $(params.GIT_REPO_NAME)
    - name: subdirectory
      value: "."
    - name: deleteExisting
      value: "false"
    taskRef:
      kind: Task
      name: git-clone
    workspaces:
    - name: output
      workspace: resources
##------------------------------------------------------------------
# Build Node.JS application
##------------------------------------------------------------------
  - name: build
    params:
    - name: TLSVERIFY
      value: "false"
    - name: STORAGE_DRIVER
      value: $(params.STORAGE_DRIVER)
    - name: app-dir
      value: $(params.PATH_CONTEXT)
    - name: node_js_image_repo
      value: $(params.node_js_image_repo)
    - name: node_js_image_name
      value: $(params.node_js_image_name)
    - name: node_js_image_tag
      value: $(params.node_js_image_tag)
    runAfter:
     - fetch-repository
    taskRef:
      kind: Task
      name: build
    workspaces:
    - name: resources
      workspace: resources
    - name: files
      workspace: files
#------------------------------------------------------------------
# Push the new runtime image to OpenShift imagestream
#------------------------------------------------------------------
  - name: push-image-to-imagestream
    params:
    - name: imagestream-url
      value: $(params.IMAGE_NAME)
    - name: STORAGE_DRIVER
      value: $(params.STORAGE_DRIVER)
    - name: TLSVERIFY
      value: "$(params.TLSVERIFY)"
    - name: pipelineRunName
      value: $(context.pipelineRun.name)
    - name: image-short-name
      value: $(params.IMAGE_SHORT_NAME)
    - name: git-commit
      value: $(tasks.fetch-repository.results.commit)
    taskRef:
      kind: Task
      name: push-image-to-ocp
    runAfter:
      - build
    workspaces:
    - name: files
      workspace: files
##------------------------------------------------------------------
# Generate SBOM
##------------------------------------------------------------------
  - name: generate-sbom
    params:
    - name: SBOM_FILE
      value: "sbom-image.json"
    - name: public-url
      value: $(params.IMAGE_NAME):$(tasks.push-image-to-imagestream.results.new-tag)
    runAfter:
     - push-image-to-imagestream
    taskRef:
      kind: Task
      name: generate-sbom
    workspaces:
    - name: resources
      workspace: resources  
##------------------------------------------------------------------
# Push the new runtime image to quay.io
##------------------------------------------------------------------
  - name: push-image-to-quay
    params:
    - name: quay-instance-url
      value: $(params.quay-instance-url)
    - name: quay-account
      value: $(params.quay-account)
    - name: quay-repository
      value: $(params.quay-repository)
    - name: image-stream-location
      value: $(params.IMAGE_NAME)
    - name: STORAGE_DRIVER
      value: $(params.STORAGE_DRIVER)
    - name: imageTag
      value: $(tasks.push-image-to-imagestream.results.new-tag)
    - name: node_js_image_name
      value: $(params.node_js_image_name)
    - name: rekor-url
      value: $(params.rekor-url)
    taskRef:
      kind: Task
      name: push-image-to-quay
    runAfter:
      - generate-sbom
    workspaces:
    - name: resources
      workspace: resources
    - name: files
      workspace: files
##------------------------------------------------------------------
# Workspaces and results
##------------------------------------------------------------------
  workspaces:
  - name: resources
  - name: files